<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>闪卡学习</title>
</head>
<body>
  <header id="header">
    <button id="header-back" class="header-back" aria-label="返回">‹</button>
    <h1 id="header-title">闪卡学习</h1>
  </header>

  <main id="app"></main>

  <nav id="tabbar">
    <button class="tab active" data-tab="home">
      <span class="tab-icon">🏠</span><span class="tab-label">首页</span>
    </button>
    <button class="tab" data-tab="study">
      <span class="tab-icon">🎯</span><span class="tab-label">刷题</span>
    </button>
    <button class="tab" data-tab="wrong">
      <span class="tab-icon">❌</span><span class="tab-label">错题</span>
    </button>
    <button class="tab" data-tab="settings">
      <span class="tab-icon">⚙️</span><span class="tab-label">设置</span>
    </button>
  </nav>

  <div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
